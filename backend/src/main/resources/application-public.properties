# ネット公開用の設定（docs/public-testing.md）。起動時に --spring.profiles.active=public を付けると、application.properties に追加で読み込まれる
# 構成：ブラウザ ──HTTPS──▶ Cloudflare ──トンネル──▶ このPCの Spring Boot（HTTP、ポート 8080）

# トンネルからの接続だけを受け付ける（同じWi-Fiの他の機器から直接接続させない）
server.address=127.0.0.1

# Cloudflare が付ける X-Forwarded-Proto ヘッダーを信用し、「ブラウザとは HTTPS で通信している」と判断する。
# これにより CSRF の Cookie に Secure が付き、HSTS ヘッダー（以後 HTTPS でのみ接続させる指示）も返される
server.forward-headers-strategy=framework

# セッションの Cookie（JSESSIONID）は HTTPS の通信でのみ送らせる
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax

# React をビルドした成果物（frontend/dist）を Spring Boot から配信する（API設計書 1.4節）。
# backend/ とリポジトリ直下のどちらから起動しても読めるよう両方を指定
spring.web.resources.static-locations=file:../frontend/dist/,file:frontend/dist/
