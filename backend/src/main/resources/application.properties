spring.application.name=mindlog

# リポジトリ直下の .env（MYSQL_USER 等）を読み込む。backend/ とリポジトリ直下のどちらから起動しても読めるよう両方を指定
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# DB（compose.yaml で起動する MySQL。ポート 3307）
# connectionCollation：接続側の照合順序をテーブルと同じ utf8mb4_bin にそろえる（DB設計書 1.1節）
spring.datasource.url=jdbc:mysql://localhost:3307/${MYSQL_DATABASE}?connectionCollation=utf8mb4_bin
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# テーブルは Flyway（src/main/resources/db/migration）で作成する。JPA はエンティティとテーブルの整合性チェックのみ行う
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
